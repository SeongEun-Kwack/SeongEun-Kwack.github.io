<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>곽성은 | 게임 기획자 & PM 포트폴리오 Hub</title>
<meta name="description" content="곽성은 포트폴리오 문서" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ===== Blueprint Grid — Design Tokens ===== */
  :root{
    --bg:#fafafa;
    --surface:#ffffff;
    --text:#0a0a0a;
    --text-muted:#6b6b6b;
    --border:#e6e6e6;
    --grid:#e6e6e6;
    --cross:#c2c2c2;
    --accent:#e5484d;
    --font-display:'IBM Plex Sans', Inter, sans-serif;
    --font-mono:'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;
    --unit:24px;
    --content-max:1200px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }

  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(circle, var(--grid) 1px, transparent 1px);
    background-size: var(--unit) var(--unit);
    color:var(--text);
    font-family:var(--font-display);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; }

  .frame{
    max-width:var(--content-max);
    margin:0 auto;
    border-left:1px solid var(--grid);
    border-right:1px solid var(--grid);
    background-color:transparent;
  }

  .inner{ padding:0 var(--unit); }

  section{ position:relative; }

  .section-pad{ padding:96px 0; }
  .section-pad-sm{ padding:64px 0; }

  .section-divider{
    border-top:1px solid var(--grid);
  }

  /* ===== Eyebrow / Mono labels ===== */
  .eyebrow{
    font-family:var(--font-mono);
    font-size:0.75rem;
    font-weight:500;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--accent);
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-bottom:16px;
  }
  .eyebrow::before{ content:'//'; color:var(--cross); }

  .index-tag{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--text-muted);
    letter-spacing:0.02em;
  }

  .coord{
    font-family:var(--font-mono);
    font-size:0.7rem;
    color:var(--text-muted);
    letter-spacing:0.01em;
  }

  /* ===== Typography ===== */
  h1{
    font-size:clamp(2.4rem, 5vw, 4.2rem);
    font-weight:600;
    letter-spacing:-0.02em;
    line-height:1.08;
  }
  h2{
    font-size:clamp(1.6rem, 2.8vw, 2.3rem);
    font-weight:600;
    line-height:1.15;
    letter-spacing:-0.01em;
  }
  h3{
    font-size:1.15rem;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  p{ color:var(--text); }
  .muted{ color:var(--text-muted); }

  /* ===== Nav ===== */
  .nav-header{
    position:sticky;
    top:0;
    z-index:100;
    background-color:rgba(250,250,250,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--grid);
  }
  .nav-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:64px;
  }
  .nav-logo{
    font-family:var(--font-mono);
    font-size:0.85rem;
    font-weight:600;
    letter-spacing:0.02em;
    text-decoration:none;
    color:var(--text);
  }
  .nav-logo span{ color:var(--accent); }
  .nav-links{
    display:flex;
    align-items:center;
    gap:28px;
    list-style:none;
  }
  .nav-links a{
    font-family:var(--font-mono);
    font-size:0.72rem;
    font-weight:500;
    letter-spacing:0.03em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--text-muted);
    transition:color 160ms ease-out;
  }
  .nav-links a:hover{ color:var(--accent); }
  .nav-cta{
    border:1px solid var(--text);
    padding:7px 14px;
    color:var(--text) !important;
    transition:border-color 160ms ease-out, color 160ms ease-out, background-color 160ms ease-out;
  }
  .nav-cta:hover{
    border-color:var(--accent);
    color:#ffffff !important;
    background-color:var(--accent);
  }
  @media (max-width:768px){
    .nav-links{ gap:14px; }
    .nav-links li:not(.nav-cta-item){ display:none; }
  }

  /* ===== Buttons ===== */
  .btn{
    font-family:var(--font-mono);
    font-size:0.8rem;
    font-weight:500;
    letter-spacing:0.03em;
    text-transform:uppercase;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:48px;
    padding:0 28px;
    border-radius:0;
    border:1px solid var(--text);
    transition:background-color 160ms ease-out, color 160ms ease-out, border-color 160ms ease-out;
    cursor:pointer;
  }
  .btn-primary{
    background-color:var(--accent);
    border-color:var(--accent);
    color:#ffffff;
  }
  .btn-primary:hover{ background-color:#c93a3e; border-color:#c93a3e; }
  .btn-outline{
    background-color:transparent;
    color:var(--text);
  }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-group{ display:flex; gap:16px; flex-wrap:wrap; }

  /* ===== Blueprint card w/ corner cross markers ===== */
  .bp-card{
    position:relative;
    background-color:var(--surface);
    border:1px solid var(--grid);
    padding:32px;
    --cross-color:var(--cross);
    transition:border-color 160ms ease-out;
  }
  .bp-card:hover{ --cross-color:var(--accent); border-color:var(--accent); }

  .corner{
    position:absolute;
    width:12px;
    height:12px;
    pointer-events:none;
  }
  .corner::before{
    content:'';
    position:absolute;
    top:50%; left:0;
    width:100%; height:1px;
    background-color:var(--cross-color);
    transform:translateY(-50%);
    transition:background-color 160ms ease-out;
  }
  .corner::after{
    content:'';
    position:absolute;
    left:50%; top:0;
    height:100%; width:1px;
    background-color:var(--cross-color);
    transform:translateX(-50%);
    transition:background-color 160ms ease-out;
  }
  .corner.tl{ top:-6px; left:-6px; }
  .corner.tr{ top:-6px; right:-6px; }
  .corner.bl{ bottom:-6px; left:-6px; }
  .corner.br{ bottom:-6px; right:-6px; }

  /* ===== Hero ===== */
  .hero-grid{
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:var(--unit);
    align-items:start;
  }
  .hero-sub{
    font-size:1.05rem;
    color:var(--text-muted);
    max-width:56ch;
    margin:20px 0 40px;
  }
  .hero-panel{
    position:relative;
  }
  .shot-viewer-hero{
    height:480px;
  }
  @media (max-width:1024px){ .shot-viewer-hero{ height:420px; } }
  .hero-panel-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background-color:var(--grid);
    border:1px solid var(--grid);
    margin-top:8px;
  }
  .hero-stat{
    background-color:var(--surface);
    padding:20px 16px;
  }
  .hero-stat .num{
    font-family:var(--font-mono);
    font-size:1.6rem;
    font-weight:600;
    color:var(--accent);
    display:block;
  }
  .hero-stat .label{
    font-family:var(--font-mono);
    font-size:0.68rem;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:0.03em;
    display:block;
    margin-top:6px;
  }
  @media (max-width:1024px){
    .hero-grid{ grid-template-columns:1fr; }
  }

  /* ===== Doc Hub ===== */
  .doc-tabs-nav{
    display:flex;
    flex-wrap:wrap;
    border-bottom:1px solid var(--grid);
    margin-bottom:32px;
  }
  .doc-tab-btn{
    font-family:var(--font-mono);
    font-size:0.72rem;
    font-weight:500;
    letter-spacing:0.02em;
    text-transform:uppercase;
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    color:var(--text-muted);
    padding:12px 18px 12px 0;
    margin-right:24px;
    cursor:pointer;
    transition:color 160ms ease-out, border-color 160ms ease-out;
    text-align:left;
  }
  .doc-tab-btn .idx{ color:var(--accent); margin-right:8px; }
  .doc-tab-btn:hover{ color:var(--text); }
  .doc-tab-btn.active{ color:var(--text); border-bottom-color:var(--accent); }

  .doc-tab-content{ display:none; }
  .doc-tab-content.active{ display:block; }

  .doc-viewer-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .doc-viewer-title{ margin-bottom:6px; }
  .doc-viewer-desc{ font-size:0.9rem; color:var(--text-muted); max-width:60ch; }

  .live-embed-frame{
    width:100%;
    height:640px;
    border:1px solid var(--grid);
    overflow:hidden;
    position:relative;
  }
  .live-embed-frame iframe{ width:100%; height:100%; border:0; }

  @media (max-width:1024px){ .live-embed-frame{ height:480px; } }
  @media (max-width:640px){ .live-embed-frame{ height:400px; } }

  /* ===== Screenshot Slideshow ===== */
  .shot-viewer{
    position:relative;
    width:100%;
    height:560px;
    border:1px solid var(--grid);
    background-color:var(--bg);
    background-image:radial-gradient(circle, var(--grid) 1px, transparent 1px);
    background-size:24px 24px;
    overflow:hidden;
  }
  .shot-index{
    position:absolute;
    top:16px; left:16px;
    z-index:2;
    background-color:var(--surface);
    padding:4px 8px;
    border:1px solid var(--grid);
  }
  .shot-track{ position:absolute; inset:0; }
  .shot-slide{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    opacity:0;
    animation:shotFade 55s infinite;
  }
  .shot-track .shot-slide:nth-child(1){ animation-delay:0s; }
  .shot-track .shot-slide:nth-child(2){ animation-delay:5s; }
  .shot-track .shot-slide:nth-child(3){ animation-delay:10s; }
  .shot-track .shot-slide:nth-child(4){ animation-delay:15s; }
  .shot-track .shot-slide:nth-child(5){ animation-delay:20s; }
  .shot-track .shot-slide:nth-child(6){ animation-delay:25s; }
  .shot-track .shot-slide:nth-child(7){ animation-delay:30s; }
  .shot-track .shot-slide:nth-child(8){ animation-delay:35s; }
  .shot-track .shot-slide:nth-child(9){ animation-delay:40s; }
  .shot-track .shot-slide:nth-child(10){ animation-delay:45s; }
  .shot-track .shot-slide:nth-child(11){ animation-delay:50s; }

  .shot-img-wrap{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 32px 12px;
  }
  .shot-slide img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border:1px solid var(--grid);
    background-color:var(--surface);
  }
  .shot-caption{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--text-muted);
    text-align:center;
    padding:10px 16px;
    border-top:1px solid var(--grid);
    background-color:var(--surface);
  }
  .shot-caption .idx{ color:var(--accent); margin-right:6px; }

  .shot-viewer:hover .shot-slide{ animation-play-state:paused; }

  @keyframes shotFade{
    0%     { opacity:0; }
    0.91%  { opacity:1; }
    8.18%  { opacity:1; }
    9.09%  { opacity:0; }
    100%   { opacity:0; }
  }

  @media (max-width:768px){ .shot-viewer{ height:460px; } }

  /* ===== Tags ===== */
  .tag-group{ display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
  .tag{
    font-family:var(--font-mono);
    font-size:0.68rem;
    letter-spacing:0.02em;
    text-transform:uppercase;
    border:1px solid var(--grid);
    padding:5px 10px;
    color:var(--text-muted);
    transition:border-color 160ms ease-out, color 160ms ease-out;
  }
  .tag:hover{ border-color:var(--accent); color:var(--accent); }

  /* ===== Career grid & Recent grid ===== */
  .career-grid, .recent-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:var(--unit);
  }
  @media (max-width:768px){ 
    .career-grid, .recent-grid{ grid-template-columns:1fr; } 
  }

  .career-period{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--accent);
    letter-spacing:0.02em;
  }
  .career-role{ font-size:0.95rem; color:var(--text-muted); margin:6px 0 16px; }
  .career-list{ list-style:none; }
  .career-list li{
    font-size:0.92rem;
    color:var(--text);
    padding-left:16px;
    position:relative;
    margin-bottom:10px;
    line-height:1.55;
  }
  .career-list li::before{
    content:'—';
    position:absolute;
    left:0;
    color:var(--cross);
  }

  /* ===== Recent Media Container ===== */
  .recent-media-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 1px solid var(--grid);
    background-color: var(--surface);
    overflow: hidden;
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .recent-media-wrap iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
  .recent-media-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 300ms ease-out;
  }
  .bp-card:hover .recent-media-wrap img {
    transform: scale(1.02);
  }

  /* ===== Footer ===== */
  footer{
    border-top:1px solid var(--grid);
    padding:56px 0;
  }
  .footer-grid{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:32px;
  }
  .footer-name{ font-size:1.1rem; font-weight:600; margin-bottom:6px; }
  .footer-role{ font-family:var(--font-mono); font-size:0.75rem; color:var(--text-muted); letter-spacing:0.02em; }
  .footer-links{ text-align:right; font-family:var(--font-mono); font-size:0.8rem; line-height:2; }
  .footer-links a{ text-decoration:none; color:var(--text); border-bottom:1px solid var(--grid); transition:border-color 160ms ease-out, color 160ms ease-out; }
  .footer-links a:hover{ color:var(--accent); border-color:var(--accent); }
  @media (max-width:640px){ .footer-grid{ align-items:flex-start; } .footer-

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>곽성은 | 게임 기획자 & PM 포트폴리오 Hub</title>
<meta name="description" content="곽성은 포트폴리오 문서" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ===== Blueprint Grid — Design Tokens ===== */
  :root{
    --bg:#fafafa;
    --surface:#ffffff;
    --text:#0a0a0a;
    --text-muted:#6b6b6b;
    --border:#e6e6e6;
    --grid:#e6e6e6;
    --cross:#c2c2c2;
    --accent:#e5484d;
    --font-display:'IBM Plex Sans', Inter, sans-serif;
    --font-mono:'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;
    --unit:24px;
    --content-max:1200px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }

  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(circle, var(--grid) 1px, transparent 1px);
    background-size: var(--unit) var(--unit);
    color:var(--text);
    font-family:var(--font-display);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; }

  .frame{
    max-width:var(--content-max);
    margin:0 auto;
    border-left:1px solid var(--grid);
    border-right:1px solid var(--grid);
    background-color:transparent;
  }

  .inner{ padding:0 var(--unit); }

  section{ position:relative; }

  .section-pad{ padding:96px 0; }
  .section-pad-sm{ padding:64px 0; }

  .section-divider{
    border-top:1px solid var(--grid);
  }

  /* ===== Eyebrow / Mono labels ===== */
  .eyebrow{
    font-family:var(--font-mono);
    font-size:0.75rem;
    font-weight:500;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--accent);
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-bottom:16px;
  }
  .eyebrow::before{ content:'//'; color:var(--cross); }

  .index-tag{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--text-muted);
    letter-spacing:0.02em;
  }

  .coord{
    font-family:var(--font-mono);
    font-size:0.7rem;
    color:var(--text-muted);
    letter-spacing:0.01em;
  }

  /* ===== Typography ===== */
  h1{
    font-size:clamp(2.4rem, 5vw, 4.2rem);
    font-weight:600;
    letter-spacing:-0.02em;
    line-height:1.08;
  }
  h2{
    font-size:clamp(1.6rem, 2.8vw, 2.3rem);
    font-weight:600;
    line-height:1.15;
    letter-spacing:-0.01em;
  }
  h3{
    font-size:1.15rem;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  p{ color:var(--text); }
  .muted{ color:var(--text-muted); }

  /* ===== Nav ===== */
  .nav-header{
    position:sticky;
    top:0;
    z-index:100;
    background-color:rgba(250,250,250,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--grid);
  }
  .nav-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:64px;
  }
  .nav-logo{
    font-family:var(--font-mono);
    font-size:0.85rem;
    font-weight:600;
    letter-spacing:0.02em;
    text-decoration:none;
    color:var(--text);
  }
  .nav-logo span{ color:var(--accent); }
  .nav-links{
    display:flex;
    align-items:center;
    gap:28px;
    list-style:none;
  }
  .nav-links a{
    font-family:var(--font-mono);
    font-size:0.72rem;
    font-weight:500;
    letter-spacing:0.03em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--text-muted);
    transition:color 160ms ease-out;
  }
  .nav-links a:hover{ color:var(--accent); }
  .nav-cta{
    border:1px solid var(--text);
    padding:7px 14px;
    color:var(--text) !important;
    transition:border-color 160ms ease-out, color 160ms ease-out, background-color 160ms ease-out;
  }
  .nav-cta:hover{
    border-color:var(--accent);
    color:#ffffff !important;
    background-color:var(--accent);
  }
  @media (max-width:768px){
    .nav-links{ gap:14px; }
    .nav-links li:not(.nav-cta-item){ display:none; }
  }

  /* ===== Buttons ===== */
  .btn{
    font-family:var(--font-mono);
    font-size:0.8rem;
    font-weight:500;
    letter-spacing:0.03em;
    text-transform:uppercase;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    height:48px;
    padding:0 28px;
    border-radius:0;
    border:1px solid var(--text);
    transition:background-color 160ms ease-out, color 160ms ease-out, border-color 160ms ease-out;
    cursor:pointer;
  }
  .btn-primary{
    background-color:var(--accent);
    border-color:var(--accent);
    color:#ffffff;
  }
  .btn-primary:hover{ background-color:#c93a3e; border-color:#c93a3e; }
  .btn-outline{
    background-color:transparent;
    color:var(--text);
  }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-group{ display:flex; gap:16px; flex-wrap:wrap; }

  /* ===== Blueprint card w/ corner cross markers ===== */
  .bp-card{
    position:relative;
    background-color:var(--surface);
    border:1px solid var(--grid);
    padding:32px;
    --cross-color:var(--cross);
    transition:border-color 160ms ease-out;
  }
  .bp-card:hover{ --cross-color:var(--accent); border-color:var(--accent); }

  .corner{
    position:absolute;
    width:12px;
    height:12px;
    pointer-events:none;
  }

    content:'';
    position:absolute;
    top:50%; left:0;
    width:

<style>
  /* ===== Blueprint Grid — Design Tokens ===== */
  :root{
    --bg:#fafafa;
    --surface:#ffffff;
    --text:#0a0a0a;
    --text-muted:#6b6b6b;
    --border:#e6e6e6;
    --grid:#e6e6e6;
    --cross:#c2c2c2;
    --accent:#e5484d;
    --font-display:'IBM Plex Sans', Inter, sans-serif;
    --font-mono:'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;
    --unit:24px;
    --content-max:1200px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ scroll-behavior:smooth; }

  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(circle, var(--grid) 1px, transparent 1px);
    background-size: var(--unit) var(--unit);
    color:var(--text);
    font-family:var(--font-display);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; }

  .frame{
    max-width:var(--content-max);
    margin:0 auto;
    border-left:1px solid var(--grid);
    border-right:1px solid var(--grid);
    background-color:transparent;
  }

  .inner{ padding:0 var(--unit); }

  section{ position:relative; }

  .section-pad{ padding:96px 0; }
  .section-pad-sm{ padding:64px 0; }

  .section-divider{
    border-top:1px solid var(--grid);
  }

  /* ===== Eyebrow / Mono labels ===== */
  .eyebrow{
    font-family:var(--font-mono);
    font-size:0.75rem;
    font-weight:500;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--accent);
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-bottom:16px;
  }
  .eyebrow::before{ content:'//'; color:var(--cross); }

  .index-tag{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--text-muted);
    letter-spacing:0.02em;
  }

  .coord{
    font-family:var(--font-mono);
    font-size:0.7rem;
    color:var(--text-muted);
    letter-spacing:0.01em;
  }

  h1{

    font-weight:600;
    letter-spacing:-0.02em;
    line-height:1.08;
  }
